link:
  datasource:
    host: mysql
    port: 3306
    database: link_db
    username: root
    password: ${DATA_PASSWORD}
  redis:
    host: redis
    port: 6379
    password: ${DATA_PASSWORD}
    database: 0
    timeout: 2000
# todo 由于服务器资源有限，项目暂时不使用 RabbitMQ，相关配置注释掉，后续可根据需要启用并调整连接信息
#  rabbitmq:
#    host: rabbitmq
#    port: 5672
#    username: root
#    password: ${DATA_PASSWORD}
#    virtual-host: /linkPulse
  redirect:
    url-prefix: "http://47.80.18.27/api/"
  visitor-tracking:
    # Nginx proxy_pass 已去掉 /api，后端看到的是 /user/... 等非前缀路径，此处保持默认即可。
    servlet-path-prefix: ""
    record-only-under-prefix: false
  logging:
    level:
      com.hejiale: info
      org.springframework.ai.chat.client.advisor: info
  cors:
    allowed-origins: "www.linkpulse.asia"