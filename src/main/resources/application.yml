server:
  port: 8080 #端口
  tomcat:
    uri-encoding: UTF-8 #服务编码

spring:
  profiles:
    active: local # 激活环境配置
  datasource:
    url: jdbc:mysql://${link.datasource.host}:${link.datasource.port}/${link.datasource.database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${link.datasource.username} # 数据库用户名
    password: ${link.datasource.password} # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB        # 单个文件最大10MB
      max-request-size: 30MB     # 单次请求最大30MB（支持多张图片同时上传）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss   # 指定返回json日期格式
    time-zone: GMT+8
  rabbitmq:
    host: ${link.rabbitmq.host}      # 服务地址
    port: ${link.rabbitmq.port}           # 端口，默认5672
    username: ${link.rabbitmq.username}      # 用户名
    password: ${link.rabbitmq.password}      # 密码
    virtual-host: ${link.rabbitmq.virtual-host}      # 虚拟主机
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  data:
    redis:
      host: ${link.redis.host}
      port: ${link.redis.port}
      password: ${link.redis.password}
      database: ${link.redis.database}
      timeout: ${link.redis.timeout}
  ai:
    openai:
      base-url: "https://dashscope.aliyuncs.com/compatible-mode"
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: qwen-plus # deepseek-r1
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
    vectorstore:
      redis:
        initialize-schema: true
        prefix: "doc:"
        index-name: spring-ai-index

logging:
  level:
    com.hejiale: ${link.logging.level.com.hejiale}
    org.springframework.ai.chat.client.advisor: ${link.logging.level.org.springframework.ai.chat.client.advisor}

link:
  visitor-tracking:
    # 若 Nginx 去掉 /api 再转发，后端路径无 /api，保持下面两项默认即可。
    # 若 Nginx 完整保留 /api 路径转发到 Spring，则 servlet-path-prefix: /api 且可设 record-only-under-prefix: true
    servlet-path-prefix: ""
    record-only-under-prefix: false
    sync-enabled: true
    # 当天 Redis → MySQL 快照间隔（毫秒），不删 Redis
    sync-fixed-rate-ms: 300000
  jwt:
    # 设置 jwt 签名加密时使用的秘钥
    secret-key: linkPulse-secretKey-2026-secure-key!
    # 设置 jwt 过期时间
    ttl: 360000000
    # 设置前端传递过来的令牌名称
    token-name: token
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET}
    bucket-name: linkcode