link:
  datasource:
    host: mysql
    port: 3306
    database: link_db
    username: root
    password: ${DATA_PASSWORD}
  redis:
    host: redis
    port: 6379
    password: ${DATA_PASSWORD}
    database: 0
    timeout: 2000
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: root
    password: ${DATA_PASSWORD}
    virtual-host: /linkPulse
  redirect:
    url-prefix: "http://192.168.150.101/api/"
  logging:
    level:
      com.hejiale: info
      org.springframework.ai.chat.client.advisor: info