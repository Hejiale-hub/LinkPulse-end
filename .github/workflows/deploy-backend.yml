name: Deploy Backend # 后端

on:
  push:
    branches: [ main ] # 当代码推送到 main 分支时触发

jobs:
  deploy:
    runs-on: ubuntu-latest # 使用 GitHub 提供的免费 Linux 服务器
    steps:
      # 1. 把你的代码拉取到 GitHub 服务器上
      - uses: actions/checkout@v3

      # 2. 准备 Java 环境并编译 Spring Boot
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21' # ⚠️ 请改成你项目实际使用的 Java 版本 (如 8, 11, 17)
          distribution: 'temurin'

      - name: Build Spring Boot
        run: mvn clean package -DskipTests # 编译打包，跳过测试加快速度
      # 4. 将编译好的文件自动上传到阿里云服务器
      - name: Upload Backend to Aliyun
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 只传后端项目文件中的 jar 包
          source: "target/*.jar" # 如果想要部署文件一起更新，如dockerfile，也可以加上，比如 source: "target/*.jar, Dockerfile"
          target: "/root/deploy/backend" # 传到服务器的后端专属目录
          # strip_components: 1 如果你不想在服务器上创建 target 目录，可以加上这个，它会去掉第一层目录结构
      # 5. 登录阿里云服务器重启 Docker
      - name: Restart Backend Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 进入你的部署目录
            cd /root/deploy
            # 注意：这里指定只重启后端的容器（假设在 docker-compose 中服务名叫 backend）
            docker-compose up -d --build backend
            docker image prune -f